name: gymtron
services:
  db:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment or local .env file}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gymtron}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      # <Port exposed> : <MySQL Port running inside container>
      - '${MYSQL_PORT:-6064}:3306'
    expose:
      - '3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: src/GymTron.Api/Dockerfile
    container_name: gymtron-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${MYSQL_DATABASE:-gymtron};Uid=root;Pwd=${MYSQL_ROOT_PASSWORD};"
      Jwt__SecretKey: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in environment or .env (at least 32 bytes)}"
    ports:
      - '${API_PORT:-5000}:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
