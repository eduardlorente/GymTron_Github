name: Deploy to MonsterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    name: Deploy API
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore API
        run: dotnet restore src/GymTron.Api/GymTron.Api.csproj --source https://api.nuget.org/v3/index.json

      - name: Publish API
        run: dotnet publish src/GymTron.Api/GymTron.Api.csproj -c Release --no-restore -o publish-api

      - name: Deploy API via MSDeploy
        shell: pwsh
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) {
              $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }
          $sourcePath = (Resolve-Path ./publish-api).Path
          $destUrl = "https://${{ secrets.MONSTERASP_API_SERVER }}:8172/msdeploy.axd?site=${{ secrets.MONSTERASP_API_SITE_NAME }}"

          & $msdeploy `
            -verb:sync `
            -source:contentPath="$sourcePath" `
            -dest:contentPath="${{ secrets.MONSTERASP_API_SITE_NAME }}",computerName="$destUrl",userName="${{ secrets.MONSTERASP_API_USERNAME }}",password="${{ secrets.MONSTERASP_API_PASSWORD }}",authtype="Basic",includeAcls="False" `
            -allowUntrusted `
            -disableLink:AppPoolExtension `
            -disableLink:ContentExtension `
            -disableLink:CertificateExtension

  deploy-web:
    name: Deploy Web
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore Web
        run: dotnet restore src/GymTron.Web/GymTron.Web.csproj --source https://api.nuget.org/v3/index.json

      - name: Publish Web
        run: dotnet publish src/GymTron.Web/GymTron.Web.csproj -c Release --no-restore -o publish-web

      - name: Deploy Web via MSDeploy
        shell: pwsh
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) {
              $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }
          $sourcePath = (Resolve-Path ./publish-web).Path
          $destUrl = "https://${{ secrets.MONSTERASP_WEB_SERVER }}:8172/msdeploy.axd?site=${{ secrets.MONSTERASP_WEB_SITE_NAME }}"

          & $msdeploy `
            -verb:sync `
            -source:contentPath="$sourcePath" `
            -dest:contentPath="${{ secrets.MONSTERASP_WEB_SITE_NAME }}",computerName="$destUrl",userName="${{ secrets.MONSTERASP_WEB_USERNAME }}",password="${{ secrets.MONSTERASP_WEB_PASSWORD }}",authtype="Basic",includeAcls="False" `
            -allowUntrusted `
            -disableLink:AppPoolExtension `
            -disableLink:ContentExtension `
            -disableLink:CertificateExtension
